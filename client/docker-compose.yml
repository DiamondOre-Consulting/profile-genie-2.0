services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: profile-genie-web:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      SSR_API_URL: ${SSR_API_URL:-https://server.profilegenie.in/api/v1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://profilegenie.in}
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
